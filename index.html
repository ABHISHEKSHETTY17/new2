<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>COLLEGE FORM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  color: white;
  font-family: monospace;
}

/* Overlays */
#overlay, #browserHelp {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  text-align: center;
  padding: 20px;
}

#browserHelp {
  display: none;
  z-index: 10000;
}

/* Button */
button {
  padding: 24px 48px;
  font-size: 26px;
  background: crimson;
  color: white;
  border: none;
  border-radius: 14px;
  cursor: pointer;
}

/* Chaos text */
.spam {
  position: absolute;
  font-size: 36px;
  font-weight: bold;
  pointer-events: none;
  animation: shake 0.1s infinite;
}

@keyframes shake {
  0% { transform: translate(2px,2px); }
  50% { transform: translate(-2px,-2px); }
  100% { transform: translate(2px,-2px); }
}
</style>
</head>

<body>

<!-- Browser instruction overlay -->
<div id="browserHelp">
  <div>
    <h2>📢 OPEN IN CHROME</h2>
    <p style="line-height:1.6">
      For the best experience:<br><br>
      1️⃣ Tap the <b>⋮</b> menu<br>
      2️⃣ Select <b>Open in browser</b><br>
      3️⃣ Choose <b>Chrome</b><br><br>
      Then tap the button again 😇
    </p>
  </div>
</div>

<!-- Start overlay -->
<div id="overlay">
  <button id="startBtn">CLICK ME 😇</button>
</div>

<!-- Audio -->
<audio id="sound" preload="auto" playsinline>
  <source src="sound.mpeg" type="audio/mpeg">
</audio>

<script>
/* Detect in-app browsers (generic) */
const ua = navigator.userAgent;
const isInApp = /Instagram|FBAN|FBAV|Twitter|Line|Snapchat/i.test(ua);

if (isInApp) {
  document.getElementById("browserHelp").style.display = "flex";
}

/* Globals */
let flashInt, lagInt, fsInt, rotateInt, vibrateInt, alertInt;
let audioCtx, sourceNode, gainNode;

const sound = document.getElementById("sound");
const overlay = document.getElementById("overlay");

/* Loop audio */
sound.loop = true;
sound.addEventListener("ended", () => {
  sound.currentTime = 0;
  sound.play();
});

function randColor() {
  return `hsl(${Math.random() * 360},100%,50%)`;
}

function fullscreen() {
  document.documentElement.requestFullscreen().catch(()=>{});
}

/* 🔊 10× amplified sound */
function boostSound() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(sound);
  gainNode = audioCtx.createGain();

  gainNode.gain.value = 10; // 🔥 LOUD

  sourceNode.connect(gainNode);
  gainNode.connect(audioCtx.destination);
}

function startRotation() {
  let angle = 0;
  rotateInt = setInterval(() => {
    angle += Math.random() * 12 - 6;
    document.body.style.transform =
      `rotate(${angle}deg) scale(1.05)`;
  }, 100);
}

function startVibration() {
  if ("vibrate" in navigator) {
    vibrateInt = setInterval(() => {
      navigator.vibrate([300,150,300,150,500]);
    }, 1400);
  }
}

function startChaos() {
  flashInt = setInterval(() => {
    document.body.style.background = randColor();
  }, 60);

  lagInt = setInterval(() => {
    for (let i = 0; i < 25; i++) {
      const d = document.createElement("div");
      d.className = "spam";
      d.textContent = "⚠ SYSTEM ERROR ⚠";
      d.style.color = randColor();
      d.style.top = Math.random() * 100 + "%";
      d.style.left = Math.random() * 100 + "%";
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2000);
    }
  }, 220);

  fsInt = setInterval(fullscreen, 1200);

  alertInt = setInterval(() => {
    alert("CRITICAL SYSTEM FAILURE!");
  }, 6500);

  startRotation();
  startVibration();
}

function stopAll() {
  clearInterval(flashInt);
  clearInterval(lagInt);
  clearInterval(fsInt);
  clearInterval(rotateInt);
  clearInterval(vibrateInt);
  clearInterval(alertInt);

  sound.pause();
  sound.currentTime = 0;
  navigator.vibrate(0);

  if (audioCtx) audioCtx.close();
  if (document.fullscreenElement) document.exitFullscreen();
}

/* User click unlocks everything */
document.getElementById("startBtn").addEventListener("click", () => {
  overlay.style.display = "none";

  fullscreen();
  boostSound();

  sound.currentTime = 0;
  sound.muted = false;
  sound.play().catch(()=>{});

  startChaos();
});

/* Hidden exit */
document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && e.key === "Escape") {
    stopAll();
  }
});

document.addEventListener("contextmenu", e => e.preventDefault());
window.onbeforeunload = () => "Are you sure? 😈";
</script>

</body>
</html>
